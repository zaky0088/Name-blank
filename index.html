<!DOCTYPE html>
<html>
<head>
<title>FTTH NOC Monitoring</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
margin:0;
font-family:Arial;
background:#020b1c;
color:white;
}

/* HEADER */

header{
background:#07142c;
padding:15px;
font-size:20px;
font-weight:bold;
letter-spacing:1px;
}

/* LAYOUT */

.container{
display:flex;
min-height:100vh;
}

/* SIDEBAR */

.sidebar{
width:220px;
background:#07142c;
padding:20px;
border-right:1px solid #0f2a55;
}

.sidebar h3{
margin-bottom:20px;
color:#9db3ff;
}

.sidebar a{
display:block;
color:#ccc;
text-decoration:none;
margin:12px 0;
font-size:15px;
transition:0.3s;
}

.sidebar a:hover{
color:#00eaff;
padding-left:5px;
}

/* MAIN */

.main{
flex:1;
padding:25px;
}

/* CARDS */

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
margin-bottom:30px;
}

.card{
background:#0d1b35;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.4);
transition:0.3s;
}

.card:hover{
transform:translateY(-3px);
}

.card h3{
margin:0;
font-size:16px;
color:#9db3ff;
}

.card p{
font-size:30px;
margin:10px 0 0;
font-weight:bold;
}

/* TABLE */

table{
width:100%;
border-collapse:collapse;
background:#0d1b35;
border-radius:10px;
overflow:hidden;
}

th,td{
padding:12px;
text-align:center;
}

th{
background:#13264d;
}

tr:nth-child(even){
background:#091630;
}

/* STATUS */

.active{
color:#00ff88;
font-weight:bold;
}

.putus{
color:#ff4b4b;
font-weight:bold;
}

/* FOOTER */

footer{
margin-top:40px;
text-align:center;
color:#888;
font-size:13px;
}

/* RESPONSIVE */

@media(max-width:768px){

.container{
flex-direction:column;
}

.sidebar{
width:100%;
display:flex;
overflow:auto;
}

.sidebar a{
margin-right:15px;
}

}

</style>
</head>

<body>

<header>FTTH NOC Monitoring</header>

<div class="container">

<div class="sidebar">
<h3>Menu</h3>
<a href="#">Dashboard</a>
<a href="#">Data Jalur</a>
<a href="#">Input Jalur</a>
<a href="#">Monitoring</a>
<a href="#">Teknisi</a>
</div>

<div class="main">

<div class="cards">

<div class="card">
<h3>Total Jalur</h3>
<p>32</p>
</div>

<div class="card">
<h3>Total Core</h3>
<p>256</p>
</div>

<div class="card">
<h3>Active</h3>
<p style="color:#00ff88;">28</p>
</div>

<div class="card">
<h3>Jalur Putus</h3>
<p style="color:#ff4b4b;">4</p>
</div>

</div>

<h2>Monitoring Jalur Fiber</h2>

<table>

<tr>
<th>No</th>
<th>Jalur</th>
<th>ODP</th>
<th>Core</th>
<th>Teknisi</th>
<th>Status</th>
</tr>

<tr>
<td>1</td>
<td>FO-01</td>
<td>ODP-001</td>
<td>12</td>
<td>Achmad</td>
<td class="active">● Active</td>
</tr>

<tr>
<td>2</td>
<td>FO-02</td>
<td>ODP-002</td>
<td>8</td>
<td>Budi</td>
<td class="putus">● Putus</td>
</tr>

</table>

<footer>
FTTH Monitoring System © 2026
</footer>

</div>
</div>

</body>
</html>
